# /etc/usbshare-attach.conf

# IP oder Hostname der Rechner, an denen die USB-Geräte stecken (dort läuft "usbshare serve").
# Mehrere Server mit Leerzeichen trennen, abweichender Port mit ":PORT", z. B.:
# SERVER="192.168.1.20 192.168.1.21 werkstatt-pc:3241"
SERVER="192.168.1.20"

# Standard-Port für Server ohne eigene ":PORT"-Angabe
PORT=3240

# Welche Geräte eingebunden werden. Leer = alle angebotenen Geräte.
# Mehrere Einträge mit Leerzeichen trennen. Erlaubt: vid:pid, vid:* oder Bus-ID.
# Beispiel: DEVICES="046d:c52b 0781:* 1-4"
DEVICES=""

# Wie oft (Sekunden) nach neuen Geräten geschaut wird
INTERVAL=3
