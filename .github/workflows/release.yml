name: Build & Release

# Baut alle Programme und die Download-Pakete und veröffentlicht ein GitHub-Release
# mit dem passenden Abschnitt aus CHANGELOG.md:
#  - automatisch, wenn auf main die Version in usbshare/__init__.py geändert wird und es
#    für diese Version noch kein Release gibt (Tag v<version> wird dabei angelegt),
#  - oder beim Pushen eines Tags "v<version>".
#  - "Run workflow" (manuell): baut alles; mit "publish" wird auch veröffentlicht.

on:
  push:
    branches: [main]
    paths: ["usbshare/__init__.py"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Release veröffentlichen (falls es für die Version noch keins gibt)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # ältere Basis = läuft auch auf älteren Distributionen (glibc 2.35+, z. B. Debian 12)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libtk8.6 libtcl8.6
      - name: Python-Pakete
        run: pip install pyinstaller libusb1 sv-ttk pillow
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Bauen
        run: |
          python build.py
          mv dist/usbshare dist/usbshare-linux-x86_64
          dist/usbshare-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist/usbshare-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: pip install pyinstaller libusb1 sv-ttk pillow
      - name: Bauen
        run: |
          python build.py
          python build.py gui
          python build.py server-gui
          dist\usbshare.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: |
            dist/usbshare.exe
            dist/usbshare-client.exe
            dist/usbshare-server-gui.exe

  macos:
    # experimentell: Server für macOS (Apple Silicon), nicht Teil der Pakete
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install libusb
      - run: pip install pyinstaller libusb1 sv-ttk pillow
      - name: Bauen
        run: |
          python build.py
          mv dist/usbshare dist/usbshare-macos-arm64
          dist/usbshare-macos-arm64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: dist/usbshare-macos-arm64

  package:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - name: Version bestimmen
        id: ver
        run: |
          V=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('usbshare/__init__.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$V" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} passt nicht zu __version__ $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == push || "${{ inputs.publish }}" == true ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "Release v$V gibt es schon – nur bauen."
            else
              PUBLISH=true
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: usbip-win2 holen (Treiber für den Client, BSD-2-Clause)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p usbip
          REL=$(gh api repos/vadimgrn/usbip-win2/releases/latest)
          NAME=$(echo "$REL" | jq -r '[.assets[] | select(.name | test("^USBip-[0-9.]+-x64(-Release)?\\.exe$"))][0].name')
          DIGEST=$(echo "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .digest')
          TAG=$(echo "$REL" | jq -r .tag_name)
          echo "usbip-win2 $TAG: $NAME ($DIGEST)"
          gh release download "$TAG" --repo vadimgrn/usbip-win2 --pattern "$NAME" --dir usbip
          echo "${DIGEST#sha256:}  usbip/$NAME" | sha256sum -c -
          curl -fsSL -o usbip/LICENSE.txt "https://raw.githubusercontent.com/vadimgrn/usbip-win2/$TAG/LICENSE.txt"
          ls -la usbip
      - name: Pakete schnüren
        run: |
          ls -la bins
          python packaging/make_packages.py --version ${{ steps.ver.outputs.version }} --bins bins --out out --usbip usbip
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la out
      - name: Release-Text aus CHANGELOG.md
        run: |
          python - <<'EOF'
          import re
          v = "${{ steps.ver.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "Siehe CHANGELOG.md") + (
              "\n\n**Downloads:** für den Rechner mit den USB-Geräten `usbshare-server-…-linux-x64.zip` "
              "(Linux) oder `usbshare-server-…-win-x64.zip` (Windows); für die Windows-VM "
              "`usbshare-client-…-win-x64.zip` (mit dem Treiber usbip-win2).\n\n"
              "**Hinweis:** Die Windows-Programme sind **nicht signiert**. Windows SmartScreen "
              "warnt deshalb beim ersten Start – „Weitere Informationen“ → „Trotzdem ausführen“, "
              "oder die ZIP vor dem Entpacken unter Eigenschaften → „Zulassen“ freigeben. "
              "Details: [README](https://github.com/Goeste/usbshare#windows-warnung-die-programme-sind-nicht-signiert). "
              "Der Code wurde von Claude (KI) erstellt und kann Fehler enthalten.")
          open("release-notes.md", "w", encoding="utf-8").write(body)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: usbshare-${{ steps.ver.outputs.version }}-pakete
          path: |
            out/*.zip
            out/SHA256SUMS.txt
      # Zwei Schritte: das Linux-Paket wird zuerst hochgeladen, weil die Updater bis 0.7.0
      # das erste Paket nehmen, dessen Name mit "usbshare-server-" beginnt.
      - name: GitHub-Release (Linux-Server)
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: usbshare ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: out/usbshare-server-*-linux-*.zip
      - name: GitHub-Release (übrige Pakete)
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: usbshare ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            out/usbshare-server-*-win-*.zip
            out/usbshare-client-*.zip
            out/SHA256SUMS.txt
