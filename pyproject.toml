[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usbshare"
version = "0.6.4"
description = "USB-Geräte über das Netzwerk an VMs durchreichen (USB/IP-kompatibler Server für Linux, Windows, macOS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Goeste" }]
dependencies = ["libusb1>=3.0", "tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]

[project.optional-dependencies]
gui = ["sv-ttk>=2.6"]
build = ["pyinstaller>=6", "sv-ttk>=2.6", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/Goeste/usbshare"
Changelog = "https://github.com/Goeste/usbshare/blob/main/CHANGELOG.md"

[project.scripts]
usbshare = "usbshare.cli:main"

[tool.setuptools]
packages = ["usbshare"]

[tool.setuptools.package-data]
usbshare = ["assets/*"]
